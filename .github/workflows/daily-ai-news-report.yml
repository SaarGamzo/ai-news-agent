name: Daily AI News Report

permissions:
  contents: write

"on":
  workflow_dispatch:
  schedule:
    # Run hourly and continue only at 08:00 Asia/Jerusalem.
    - cron: "0 * * * *"

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run only at 08:00 Israel time
        id: schedule_gate
        shell: bash
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          if [[ "$HOUR" != "08" ]]; then
            echo "Not 08:00 in Asia/Jerusalem (current: $HOUR). Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run daily report
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          EMAIL_ENABLED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python main.py

      - name: Commit daily report
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.html
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: add daily ai report"
          git push
